<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve
         to real values on notched devices (iOS Safari + Capacitor WKWebView),
         not just 0 — see docs/28_Mobile_First_Architecture.md. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4F46E5" />
    <meta
      name="description"
      content="LifyQ — the AI-powered personal operating system for your tasks, goals, habits, calendar, and more."
    />

    <!-- PWA — manifest + install metadata. No service worker / offline
         caching is registered yet; see docs/28 §PWA Preparation. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LifyQ" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light dark" />

    <title>LifyQ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
